<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>All checklist items</title>
  <link rel="stylesheet" href="./overview.css?v=1.5" />
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
  <header class="toolbar">
    <p id="summary" class="summary" aria-live="polite">Loading checklists…</p>
    <div class="actions">
      <button id="btn-export" class="export" type="button" disabled
        title="Download what is shown as an Excel file">Export to Excel</button>
      <div class="toggle" role="group" aria-label="Completed items">
        <button id="btn-show" type="button" aria-pressed="true" disabled>Show completed</button>
        <button id="btn-hide" type="button" aria-pressed="false" disabled>Hide completed</button>
      </div>
    </div>
  </header>

  <section id="chart-panel" class="chart-panel" aria-labelledby="chart-title" hidden>
    <div class="chart-card">
      <div class="chart-head">
        <div>
          <h2 id="chart-title">Open items by due date</h2>
          <p id="chart-sub" class="chart-sub"></p>
        </div>
        <button id="btn-chart" class="export" type="button" aria-expanded="true" aria-controls="chart-body">Hide chart</button>
      </div>
      <div id="chart-body" class="chart-body">
        <div id="chart-wrap" class="chart-wrap"></div>
        <details class="chart-table">
          <summary>Show as table</summary>
          <div id="chart-table"></div>
        </details>
      </div>
    </div>
  </section>

  <main id="content" class="content"></main>

  <footer class="version">Checklist Overview 1.5</footer>

  <script src="./config.js"></script>
  <script src="./checklist-model.js?v=1.5"></script>
  <script src="./xlsx-export.js?v=1.5"></script>
  <script src="./timeline-chart.js?v=1.5"></script>
  <script src="./overview.js?v=1.5"></script>
</body>
</html>
